# Curated metadata overlay for discovered engines. Missing entries fall back to introspection.
# cost_model: free | per_page | per_token | per_request | local     unit_price in USD cents per unit.

[engines.Tesseract]
name = "Tesseract"
vendor = "Google / open source"
requires_key = false
supports_pdf = false
supports_tables = false
languages = ["en","fr","de","es","it","pt","nl","ar","ru","zh","ja"]
cost_model = "local"
quality_score = 55
homepage = "https://github.com/tesseract-ocr/tesseract"
[engines.Tesseract.options]
minConfidence = { type = "number", default = 40, description = "Drop words below this confidence (0-100 or 0-1)." }
preprocess = { type = "string", default = "auto", description = "auto | false - ensemble preprocessing with cross-variant voting." }

