name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr libgl1 libegl1 libxkbcommon-x11-0
      - run: pip install -e ".[local,desktop,dev]"
      - run: ruff check ocrroute tests
      - run: pytest -q --cov=ocrroute --cov-report=xml
        env: { QT_QPA_PLATFORM: offscreen }
      - uses: actions/upload-artifact@v4
        with: { name: "coverage-${{ matrix.os }}-${{ matrix.python }}", path: coverage.xml }
