name: build-executables
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      onefile:
        description: "Build single-file executables"
        type: boolean
        default: false
      publish:
        description: "Publish a GitHub release v<version> from this run (version read from ocrroute/version.py)"
        type: boolean
        default: false
      allow_incomplete:
        description: "With publish: release whatever built successfully, as a pre-release (default: all builds must pass)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.platform.label }} (${{ matrix.edition }})
    strategy:
      fail-fast: false
      matrix:
        edition: [lean, full]   # full = lean + EasyOCR (PyTorch CPU) + PaddleOCR (PaddlePaddle)
        platform:
          - { os: ubuntu-22.04, label: linux-x86_64 }
          - { os: windows-2022, label: windows-x86_64 }
          - { os: macos-latest, label: macos-arm64 }       # Apple silicon; follows GitHub's current macOS image
          # Intel. macos-13 was retired on 2025-12-04 (jobs on it wait forever). macos-15-intel is GitHub's last
          # x86_64 macOS image, announced as available until August 2027; drop this entry after that.
          - { os: macos-15-intel, label: macos-x86_64 }
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: ${{ matrix.edition == 'full' && 150 || 60 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0
      - name: System packages (macOS)
        if: runner.os == 'macOS'
        run: brew install tesseract || true
      - name: System packages (Windows)
        if: runner.os == 'Windows'
        run: choco install tesseract --no-progress -y || echo "tesseract optional"
      - name: Install project
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # --only-binary for packages with native code: never compile them from source on the runner. A source
          # build of cryptography links the runner's OpenSSL, which clashes with the libssl bundled from Python
          # ("Symbol not found: _SSL_get0_group_name" on macOS x86_64). pip picks the newest version with a wheel.
          pip install --prefer-binary --only-binary=cryptography,cffi,pydantic-core,argon2-cffi-bindings,numpy,pillow \
            -e ".[api,local,desktop,dev]" pyinstaller
          python - <<'PY'
          import cryptography, platform, sys
          print("cryptography", cryptography.__version__, "on", sys.platform, platform.machine())
          import cryptography.hazmat.bindings._rust  # noqa: F401  (must import cleanly before freezing)
          import mistralai  # noqa: F401  (Mistral OCR is bundled)
          PY
      - name: Install Full-edition engines (EasyOCR + PaddleOCR)
        if: matrix.edition == 'full'
        shell: bash
        run: python scripts/install_full_edition.py   # skips EasyOCR on macOS x86_64 (no PyTorch >= 2.3 there)
      - name: Smoke test
        env: { QT_QPA_PLATFORM: offscreen }
        run: pytest -q tests/unit
      - name: Build executables
        run: python scripts/build_executable.py --target all --clean --edition ${{ matrix.edition }} ${{ inputs.onefile && '--onefile' || '' }}
      - name: Verify server binary
        shell: bash
        env:
          OCRROUTE_HOME: ${{ runner.temp }}/ocrroute-home
          PYTHONIOENCODING: utf-8
          PYTHONFAULTHANDLER: "1"
          EDITION: ${{ matrix.edition }}
          PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
        run: |
          # GitHub runs this with `bash -e`; turn -e OFF so check() can capture a failure and print its logs
          # (with -e, a failing command ends the script before its exit code can be read).
          set +e -u -o pipefail
          SUFFIX=""; [ "${EDITION}" = "full" ] && SUFFIX="-full"
          if [ "${RUNNER_OS}" = "Windows" ]; then BIN="dist/ocrroute-server${SUFFIX}/ocrroute-server${SUFFIX}.exe"; else BIN="dist/ocrroute-server${SUFFIX}/ocrroute-server${SUFFIX}"; fi
          echo "runner: ${RUNNER_OS} $(uname -m) | edition: ${EDITION} | binary: $BIN"
          [ "${RUNNER_OS}" = "macOS" ] && { sw_vers || true; file "$BIN" || true; }
          test -x "$BIN" || { echo "::error::frozen binary not found at $BIN"; ls -R dist | head -50; exit 1; }
          check() {  # check <name> <cmd...>: run, keep stdout/stderr in files, explain any failure
            local name="$1"; shift
            "$@" > "$name.out" 2> "$name.err"; local rc=$?
            if [ $rc -ne 0 ]; then
              local why="exit code $rc"; [ $rc -gt 128 ] && why="$why (killed by signal $((rc - 128)): $(kill -l $((rc - 128)) 2>/dev/null || echo '?'))"
              echo "::error::'$*' failed: $why"
              echo "----- stderr of $name (last 80 lines) -----"; tail -n 80 "$name.err"
              echo "----- stdout of $name (first 40 lines) -----"; head -n 40 "$name.out"
              exit 1
            fi
          }
          # Diagnostic (never fails the step): import every engine module in a child process, as the crash-isolated
          # discovery does, and report how far it gets. If the interpreter dies, the last START names the culprit.
          "$BIN" --ocrroute-probe-engines > probe.out 2> probe.err; prc=$?
          if grep -q '^DONE' probe.out; then
            echo "engine import probe: all $(grep -c '^END ' probe.out) modules imported without crashing"
          else
            last=$(grep '^START ' probe.out | tail -n 1 | cut -d' ' -f2)
            echo "::warning::engine import probe died (exit $prc) while importing: ${last:-<before any engine>}"
            echo "----- probe stderr (last 40 lines) -----"; tail -n 40 probe.err
          fi
          # Full output goes to files (never piped into head: a reader that stops early breaks the pipe).
          check version "$BIN" version --json
          check engines "$BIN" engines list --json
          python - <<'PY'
          import json
          v = json.load(open("version.out", encoding="utf-8"))
          e = json.load(open("engines.out", encoding="utf-8"))
          ok = [x for x in e if x["available"]]
          crashed = [x["id"] for x in e if "crashed the interpreter" in (x.get("import_error") or "")]
          assert v["name"] == "OcrRoute", v
          assert len(e) >= 40, f"only {len(e)} engines discovered in the frozen binary"
          assert any(x["id"] == "Tesseract" for x in e), "Tesseract missing from the frozen binary"
          mistral = next((x for x in e if x["id"] == "MistralOcr"), None)
          assert mistral and mistral["available"], f"MistralOcr must be bundled: {mistral and mistral['import_error']}"
          print(f"OcrRoute {v['version']}: {len(e)} engines discovered, {len(ok)} importable in this bundle")
          missing = [x["id"] for x in e if not x["available"] and "crashed the interpreter" not in (x.get("import_error") or "")]
          claimed = {"EasyOCR": "EasyOCR", "PaddleOCR": "PaddleOcr", "Surya": "SuryaOcr"}
          for name in v.get("bundled_extra_engines", []):
              x = next((y for y in e if y["id"] == claimed[name]), None)
              if x and not x["available"]:
                  print(f"::error::{name} is bundled in this edition but does not import in the frozen app: {x['import_error']}")
                  raise SystemExit(1)
          print(f"{len(missing)} deep-learning engines not bundled by design (pip extras): {', '.join(missing)}")
          if crashed:
              print(f"::warning::{len(crashed)} engine(s) disabled because a compiled dependency crashed on this runner: {', '.join(crashed)}")
          PY
          [ $? -eq 0 ] || exit 1
          if [ "${EDITION}" = "full" ]; then
            # Real OCR through every engine this Full build bundles (downloads the engines' models on first use).
            python -c "from PIL import Image, ImageDraw, ImageFont; im = Image.new('RGB', (900, 180), 'white'); ImageDraw.Draw(im).text((30, 50), 'OcrRoute Invoice 2026', fill='black', font=ImageFont.load_default(size=64)); im.save('full-test.png')"
            for ENGINE in $(python -c "import json; v = json.load(open('version.out')); print(' '.join({'EasyOCR': 'EasyOCR', 'PaddleOCR': 'PaddleOcr', 'Surya': 'SuryaOcr'}[n] for n in v['bundled_extra_engines']))"); do
              check "ocr-$ENGINE" "$BIN" ocr full-test.png -e "$ENGINE" --no-cache
              python - "$ENGINE" <<'PY'
          import sys
          engine = sys.argv[1]
          text = open(f"ocr-{engine}.out", encoding="utf-8").read()
          print(f"{engine}: {text.strip()[:120]!r}")
          assert "2026" in text or "invoice" in text.lower(), f"{engine} did not read the test image"
          PY
              [ $? -eq 0 ] || exit 1
            done
            python -c "import json, platform, sys; v = json.load(open('version.out')); want = ['PaddleOCR'] + ([] if (sys.platform == 'darwin' and platform.machine() == 'x86_64') else ['EasyOCR', 'Surya']); missing = [n for n in want if n not in v['bundled_extra_engines']]; assert not missing, f'Full edition is missing {missing}'; print('Full edition bundles:', ', '.join(v['bundled_extra_engines']))" || exit 1
          fi
          # Smoke-test the server itself: start, hit /v1/health, stop.
          "$BIN" serve --port 20299 > serve.log 2>&1 &
          PID=$!
          for i in $(seq 1 90); do curl -fsS http://127.0.0.1:20299/v1/health > /dev/null 2>&1 && break; kill -0 $PID 2>/dev/null || break; sleep 1; done
          if ! curl -fsS http://127.0.0.1:20299/v1/health | grep -q '"ok"'; then
            echo "::error::frozen server did not become healthy"; echo "----- serve.log -----"; tail -n 120 serve.log
            kill $PID 2>/dev/null || true; exit 1
          fi
          echo "frozen server healthy on :20299"
          kill $PID 2>/dev/null || taskkill //PID $PID //F 2>/dev/null || true
      - name: Upload verify logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-logs-${{ matrix.platform.label }}-${{ matrix.edition }}
          path: |
            *.out
            *.err
            probe.out
            probe.err
            serve.log
            ${{ runner.temp }}/ocrroute-home/cache/*.json
          if-no-files-found: ignore
      - name: Upload artifacts
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ocrroute-${{ matrix.platform.label }}-${{ matrix.edition }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30
      - name: Artifact link in job summary
        shell: bash
        run: |
          {
            echo "### 📦 ${{ matrix.platform.label }}-${{ matrix.edition }}"
            echo ""
            echo "| file | size |"
            echo "|---|---|"
            for f in dist/*.zip dist/*.tar.gz; do [ -f "$f" ] && echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"; done
            echo ""
            echo "Download: ${{ steps.upload.outputs.artifact-url }}"
          } >> "$GITHUB_STEP_SUMMARY"

  version-check:
    name: New version?
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - name: Is v<version> already released?
        id: v
        run: |
          VERSION=$(sed -n "s/^__version__ *= *['\"]\([^'\"]*\)['\"].*/\1/p" ocrroute/version.py)
          [ -n "${VERSION}" ] || { echo "::error::could not read __version__ from ocrroute/version.py"; exit 1; }
          TAG="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null 2>&1; then NEW=false; else NEW=true; fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "new=${NEW}" >> "$GITHUB_OUTPUT"
          echo "code version ${VERSION}: tag ${TAG} $( [ "${NEW}" = true ] && echo 'does not exist yet' || echo 'already exists')"

  release:
    name: Publish release
    # Runs for a pushed version tag (git tag v0.7.1 && git push origin v0.7.1), or for "Run workflow" with
    # "publish" ticked. By default every build job must succeed. NOTE: an `if:` without a status function gets an
    # implicit success(), which silently skips this job when any build fails, so the status is spelled out here and
    # the "Why no release?" job explains every skip in the run summary.
    # Also automatic: a push to main whose ocrroute/version.py has no v<version> tag yet (bump the version, push).
    if: >-
      always() && !cancelled() &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' && inputs.publish) ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.version-check.outputs.new == 'true')) &&
      (needs.build.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.allow_incomplete))
    needs: [build, version-check]
    concurrency:
      group: publish-release   # one publication at a time: two quick pushes cannot race on the same version
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release tag must match the code version
        id: tag
        run: |
          VERSION=$(sed -n "s/^__version__ *= *['\"]\([^'\"]*\)['\"].*/\1/p" ocrroute/version.py)
          [ -n "${VERSION}" ] || { echo "::error::could not read __version__ from ocrroute/version.py"; exit 1; }
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAG="${GITHUB_REF_NAME}"; else TAG="v${VERSION}"; fi
          if [ "${TAG}" != "v${VERSION}" ]; then
            echo "::error::tag ${TAG} does not match ocrroute/version.py (${VERSION}); tag v${VERSION} instead, or bump the version first"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${TAG}"
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: ocrroute-*        # build outputs only: never the verify-logs-* diagnostics of failed jobs
          merge-multiple: true
      - name: Anything to publish?
        id: contents
        run: |
          ls -la release || true
          COUNT=$(find release -type f 2>/dev/null | wc -l | tr -d ' ')
          [ "${COUNT}" -gt 0 ] || { echo "::error::no build produced files: nothing to publish"; exit 1; }
          FOUND=$(ls release | sed -E 's/^(ocrroute-(server|desktop)(-full)?)-[0-9][^-]*-/\1 /' | sort -u | tr '\n' ';')
          echo "found=${FOUND}" >> "$GITHUB_OUTPUT"
          echo "incomplete=${{ needs.build.result != 'success' }}" >> "$GITHUB_OUTPUT"
      - name: Size guard (GitHub release files must be < 2 GiB)
        run: |
          find release -type f -size +1900M -print | tee too-big.txt
          if [ -s too-big.txt ]; then echo "::error::release files over 1.9 GB (limit 2 GiB)"; exit 1; fi
      - name: Checksums
        run: cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: GitHub Release with executables
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}  # "Run workflow" creates the tag on the commit that was built
          prerelease: ${{ steps.contents.outputs.incomplete == 'true' }}
          files: release/*
          generate_release_notes: true
          body: |
            Stand-alone executables built by CI for Windows, macOS (Intel & Apple silicon) and Linux.
            `ocrroute-server-*` = CLI + API + web control panel (double-click starts the server on http://127.0.0.1:20256).
            `ocrroute-desktop-*` = PyQt5 desktop app with the embedded server.
            `*-full-*` = Full edition: adds EasyOCR, Surya and PaddleOCR (Intel Macs: PaddleOCR only). Much larger.
            Binaries are unsigned: macOS Gatekeeper / Windows SmartScreen may warn on first launch.
            ${{ steps.contents.outputs.incomplete == 'true' && '**Incomplete pre-release**: published with "allow_incomplete" while some build jobs failed; only the files attached below were built. See the workflow run for the missing platforms.' || '' }}
      - name: Release links in summary
        run: |
          echo "### 🚀 Release ${{ steps.tag.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${{ github.repository }}/releases/tag/${{ steps.tag.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          for f in release/*; do echo "- https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/$(basename "$f")" >> "$GITHUB_STEP_SUMMARY"; done

  release-gate:
    name: Why no release?
    needs: [build, version-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Explain the release decision
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PUBLISH: ${{ inputs.publish }}
          ALLOW_INCOMPLETE: ${{ inputs.allow_incomplete }}
          BUILD: ${{ needs.build.result }}
          NEW_VERSION: ${{ needs.version-check.outputs.new }}
          TAG: ${{ needs.version-check.outputs.tag }}
        run: |
          AUTO=no
          if [ "${EVENT}" = "push" ] && [ "${REF}" = "refs/heads/main" ] && [ "${NEW_VERSION}" = "true" ]; then AUTO=yes; fi
          if [ "${REF#refs/tags/v}" != "${REF}" ] || { [ "${EVENT}" = "workflow_dispatch" ] && [ "${PUBLISH}" = "true" ]; } \
             || [ "${AUTO}" = "yes" ]; then
            WANTED=yes; else WANTED=no; fi
          {
            echo "### Release decision"
            echo "- event: \`${EVENT}\`, ref: \`${REF}\`, publish: \`${PUBLISH:-n/a}\`, allow_incomplete: \`${ALLOW_INCOMPLETE:-n/a}\`"
            echo "- build jobs overall: \`${BUILD}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${WANTED}" = "no" ] && [ "${EVENT}" = "push" ] && [ "${REF}" = "refs/heads/main" ]; then
            MSG="${TAG:-This version} is already released, so this push publishes nothing. To release, bump __version__ in ocrroute/version.py and push: the new version is published automatically once every build succeeds."
            echo "::notice title=Release skipped::${MSG}"
          elif [ "${WANTED}" = "no" ]; then
            MSG="No release requested: this was a ${EVENT} on ${REF}. Releases are published automatically when a push to main carries a new version, or with Run workflow and 'publish' ticked."
            echo "::notice title=Release skipped::${MSG}"
          elif [ "${BUILD}" = "success" ]; then
            MSG="Release ${TAG} requested$( [ "${AUTO}" = yes ] && echo ' automatically (new version on main)') and every build succeeded: the 'Publish release' job publishes it."
            echo "::notice title=Release::${MSG}"
          elif [ "${ALLOW_INCOMPLETE}" = "true" ]; then
            MSG="Release requested with allow_incomplete while builds ended '${BUILD}': publishing the builds that succeeded as a pre-release."
            echo "::warning title=Incomplete release::${MSG}"
          else
            MSG="Release requested, but the build jobs ended '${BUILD}': at least one platform failed or was cancelled, so nothing was published. Fix the failing job (see its log), or use Run workflow with 'publish' and 'allow_incomplete' ticked."
            echo "::error title=Release not published::${MSG}"
          fi
          echo "- **${MSG}**" >> "$GITHUB_STEP_SUMMARY"
