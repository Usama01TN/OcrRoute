name: Publish to PyPI

# Runs when a GitHub release is published (the Build workflow publishes v<version> automatically when the version in
# ocrroute/version.py changes on main), or by hand ("Run workflow", optionally to TestPyPI).
# Uses PyPI "trusted publishing": no token is stored; PyPI trusts this repository + workflow + environment.
# One-time setup: https://pypi.org/manage/account/publishing/ -> add a pending publisher with
#   PyPI project name: ocrroute   owner: Usama01TN   repository: OcrRoute   workflow: publish.yml   environment: pypi
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      test_pypi:
        description: "Upload to TestPyPI instead of PyPI"
        type: boolean
        default: false

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - name: Version must match the release tag
        if: github.event_name == 'release'
        run: |
          VERSION=$(sed -n "s/^__version__ *= *['\"]\([^'\"]*\)['\"].*/\1/p" ocrroute/version.py)
          [ "v${VERSION}" = "${{ github.event.release.tag_name }}" ] || { echo "::error::ocrroute/version.py says ${VERSION} but the release is ${{ github.event.release.tag_name }}"; exit 1; }
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Smoke-test the wheel in a clean environment
        run: |
          python -m venv /tmp/v && /tmp/v/bin/pip install -q dist/*.whl
          cd /tmp && OCRROUTE_HOME=/tmp/h /tmp/v/bin/ocrroute version
          cd /tmp && OCRROUTE_HOME=/tmp/h /tmp/v/bin/python -c "from ocrroute.catalog import getRegistry; n = len(getRegistry().all()); assert n >= 50, n; print(n, 'engines')"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Upload
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.test_pypi && 'testpypi' || 'pypi' }}
    permissions:
      id-token: write   # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Upload to TestPyPI
        if: inputs.test_pypi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Upload to PyPI
        if: ${{ !inputs.test_pypi }}
        uses: pypa/gh-action-pypi-publish@release/v1
